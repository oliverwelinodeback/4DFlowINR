program: trainer.py
method: grid
metric:
  name: Loss/Ref
  goal: minimize
parameters:
  network:
    parameters:
      arch:
        value: 'FFN'
      fourier_scale:
        values: [0.1, 1.0, 3.0, 5.0, 7.0, 10.0, 50.0, 100.0]
  training:
    parameters:
      use_vector_potential:
        values: [True, False]
      use_physics_loss:
        values: [True, False]