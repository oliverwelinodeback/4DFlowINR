program: trainer.py
project: "SRFlowNIR"
method: "bayes"  # or bayes or random

metric:
  name: Loss/Ref
  goal: minimize

parameters:
  network:
    parameters:
      arch:
        value: 'SIREN'
      omega_0:
        distribution: log_uniform
        min: 0.0     # ln(1) = 0
        max: 3.689   # ln(40) ≈ 3.689
