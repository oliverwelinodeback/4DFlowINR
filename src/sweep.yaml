program: trainer_wandb.py
name: "SIREN_1t_Omega_Sweep"
method: "grid"  # or bayes or random
count: 10 # max number of runs

# Random search samples hyperparameter values randomly within given distributions or sets.
# Bayesian search uses the results from previous trials to decide which set of hyperparameters 
# to evaluate next (guided by a surrogate model), typically converging faster to good hyperparameters.

metric:
  name: Loss/Train # Get reference data here!
  goal: minimize

parameters:
  network.hidden_omega_0:
    values: [10, 30, 50]
    # If continuous search:
    ## min: 10 
    ## max: 60
    ## distribution: 'uniform'
  network.first_omega_0:
    values: [30]